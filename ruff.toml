# ruff configuration for korean-exam-writer
#
# 규칙셋을 명시적으로 고정한다. select를 비워 두면 ruff 버전이 올라갈 때마다 기본
# 규칙셋이 넓어져 CI가 코드 변경 없이 깨진다(실제로 UP/BLE/S/FURB 등 77건 발생).
# 린트는 재현 가능해야 하므로 계약을 여기에 못박고, 확장은 의도적으로 한다.
[lint]
select = ["E4", "E7", "E9", "F"]   # ruff의 전통적 기본셋 — 문법·논리 오류 중심
ignore = [
    "E702",   # multiple statements on one line (semicolon) — master 원본 _paragraphs()
    "F841",   # unused local variable — master 원본 _postprocess_columns_and_box()
]

[lint.extend-per-file-ignores]
"plugins/korean-exam-writer/scripts/security_scan.py" = ["E501"]  # 보안 패턴 문자열이 길 수 있음
