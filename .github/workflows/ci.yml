name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  S: plugins/korean-exam-writer/scripts
  X: plugins/korean-exam-writer/examples

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -U jsonschema 'python-hwpx>=3.2.0,<5' lxml 'ruff==0.15.*'

      - name: Hygiene scan
        run: python $S/security_scan.py

      - name: Validate good examples (anti-hallucination gate)
        run: |
          set -e
          for f in bimunhak/game_exam bimunhak/game_full_exam bimunhak/map_exam \
                   bimunhak/philosophy_exam bimunhak/sample_exam bimunhak/tech_exam \
                   unmun/jahwasang_exam; do
            echo "== validate $f =="
            python $S/validate_exam.py "$X/$f.json"
          done

      - name: Bad examples must be rejected
        run: |
          set -e
          for f in bimunhak/sample_exam_bad unmun/jahwasang_exam_bad; do
            if python $S/validate_exam.py "$X/$f.json"; then
              echo "ERROR: $f was accepted"; exit 1
            else
              echo "OK: $f correctly rejected"
            fi
          done

      - name: Verse gates must fire (H6, H7, role-domain, misquote)
        run: |
          set -e
          python $S/validate_exam.py $X/unmun/jahwasang_exam_bad.json > /tmp/bad.json || true
          python - <<'PY'
          import json
          rules = {e["rule"] for e in json.load(open("/tmp/bad.json"))["errors"]}
          need = {"H6-missing-interpretation", "H7-no-copyright-basis",
                  "role-domain-mismatch", "H1-quote-not-substring",
                  "H1-view-quote-not-substring", "answer-monotone"}
          missing = need - rules
          assert not missing, f"gates did not fire: {sorted(missing)}"
          print("OK: all", len(need), "verse gates fired")
          PY

      - name: Uniqueness probe emits and scores
        run: |
          set -e
          python $S/probe_uniqueness.py $X/unmun/jahwasang_exam.json --emit > /tmp/probes.json
          python - <<'PY'
          import json
          p = json.load(open("/tmp/probes.json"))["probes"]
          assert len(p) == 3, p
          for x in p:
              assert "removedIndex" in x and len(x["probeToOriginal"]) == 4
          json.dump([{"qid": x["qid"], "verdict": "none"} for x in p], open("/tmp/ok.json", "w"))
          json.dump([{"qid": p[0]["qid"], "verdict": "picked", "pickedIndex": 1}], open("/tmp/ng.json", "w"))
          print("OK: emitted", len(p), "probes")
          PY
          python $S/probe_uniqueness.py $X/unmun/jahwasang_exam.json --ingest /tmp/ok.json
          if python $S/probe_uniqueness.py $X/unmun/jahwasang_exam.json --ingest /tmp/ng.json; then
            echo "ERROR: picked verdict was accepted"; exit 1
          else
            echo "OK: picked verdict correctly rejected"
          fi

      - name: Render HTML (2-column A4)
        run: |
          set -e
          for f in bimunhak/game_exam bimunhak/game_full_exam bimunhak/map_exam \
                   bimunhak/philosophy_exam bimunhak/sample_exam bimunhak/tech_exam \
                   unmun/jahwasang_exam; do
            python $S/render_html.py "$X/$f.json" -o "/tmp/$(basename $f).html"
          done

      - name: Verse keeps its line breaks
        run: |
          python - <<'PY'
          import re
          h = open("/tmp/jahwasang_exam.html", encoding="utf-8").read()
          m = re.search(r'<div class="passage-body verse">(.*?)</div>', h, re.S)
          assert m, "verse block was not rendered in verse mode"
          body = m.group(1)
          assert body.count("<p>") == 6, f"stanza count {body.count('<p>')} != 6"
          assert "<br />" in body, "line breaks were not preserved"
          print("OK: 6 stanzas, line breaks preserved")
          PY

      - name: Render HWPX
        run: |
          set -e
          for f in bimunhak/game_exam bimunhak/game_full_exam bimunhak/map_exam \
                   bimunhak/philosophy_exam bimunhak/sample_exam bimunhak/tech_exam \
                   unmun/jahwasang_exam; do
            python $S/exam_to_hwpx.py "$X/$f.json" -o "/tmp/$(basename $f).hwpx"
          done

      - name: claw-hwp fallback engine (runner has no claw-hwp — absence path + ops builder)
        run: |
          set -e
          python - <<'PY'
          import sys, json
          sys.path.insert(0, "plugins/korean-exam-writer/scripts")
          import exam_to_hwpx as m

          # 1) 러너에 claw-hwp가 없으므로 탐색은 None이어야 한다(예외 아님).
          assert m.find_claw_hwp() is None, "unexpected claw-hwp on runner"

          # 2) ops 빌더는 node 없이 순수하게 동작해야 한다 — 두 도메인 모두.
          for f, dom in [("bimunhak/sample_exam", "prose"), ("unmun/jahwasang_exam", "verse")]:
              exam = json.load(open("plugins/korean-exam-writer/examples/%s.json" % f,
                                    encoding="utf-8"))
              ops, boxed = m._claw_ops(exam)
              assert ops[0]["type"] == "setup_document", ops[0]
              types = {o["type"] for o in ops}
              assert {"append_heading", "append_paragraph"} <= types, types
              # 모든 문단은 runs 배열로 나가야 한다(마크다운 파서 우회 = * 이스케이프).
              for o in ops:
                  if o["type"] == "append_paragraph":
                      assert "runs" in o and "text" not in o, o
              # 표(<보기> 또는 지문 박스)는 반드시 단 폭으로 묶여야 한다 — 안 그러면 2단에서 넘친다.
              tables = [o for o in ops if o["type"] == "append_table"]
              for t in tables:
                  assert t.get("col_widths_cm"), t
                  assert t["col_widths_cm"][0] <= m._claw_col_cm(2) + 0.01, t
                  assert t.get("no_header") is True, t     # 머리글 셀은 좁아 세로로 찌그러진다
              # <보기>가 있는 문항은 표로 나간다.
              if any((q.get("view") or {}).get("text") for q in exam["questions"]):
                  assert tables, types
              # 두 예제는 모두 한 단에 들어가므로 지문이 박스(표)로 나와야 한다.
              assert boxed is True, (dom, boxed)
              json.dumps({"path": "x.hwpx", "operations": ops}, ensure_ascii=False)
              print("OK: %s ops=%d tables=%d boxed=%s" % (dom, len(ops), len(tables), boxed))

          # 3) 긴 지문·리터럴 * 는 표를 쓰지 않아야 한다(표는 쪼개지지 못한다).
          long_p = {"sentences": [{"sid": "p%d" % i, "text": "가" * 60} for i in range(30)]}
          assert not m._claw_passage_boxable(long_p), "긴 지문이 표로 감싸짐 — 잘림 위험"
          star_p = {"sentences": [{"sid": "p1", "text": "* 어휘풀이: 가치재"}]}
          assert not m._claw_passage_boxable(star_p), "리터럴 * 지문이 표로 감싸짐 — 이탤릭 파싱 위험"
          print("OK: 표 사용 가드 동작")
          PY

      - name: Engine absence degrades cleanly (no traceback)
        run: |
          set -e
          if python $S/exam_to_hwpx.py "$X/bimunhak/sample_exam.json" \
               -o /tmp/never.hwpx --engine claw-hwp 2>/tmp/err.txt; then
            echo "ERROR: claw-hwp engine succeeded without claw-hwp"; exit 1
          fi
          if grep -q "Traceback" /tmp/err.txt; then
            echo "ERROR: raw traceback leaked"; cat /tmp/err.txt; exit 1
          fi
          grep -q "claw-hwp" /tmp/err.txt || { echo "ERROR: no actionable message"; exit 1; }
          echo "OK: clean failure with install hint"

      - name: Lint
        run: ruff check $S
